<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
        <title>
            Моя первая страница
        </title>
    </head>
    <body>
         <!--Первый-->
        <header>
            <h1>Название сайта</h1>
            <nav>
                <a href="#">Главная</a>
                <a href="#">О компании</a>
                <a href="#">Услуги</a>
                <a href="#">Контакты</a>
                <a href="#">Политика конфиденциальности</a>
            </nav>
        </header>
        <!--Второй-->
        <main>
            <section class="hero">
                <h2>О команде</h2>
                <p>Готова взять Вас к нам!</p>
                <button>Записаться</button>
            </section>
            <section class="cards">
                <div class="card">
                    <h3>Блок 1</h3>
                    <p>Описание</p>
                </div>
                <div class="card">
                    <h3>Блок 2</h3>
                    <p>Описание</p>
                </div>
                <div class="card">
                    <h3>Блок 3</h3>
                    <p>Описание</p>
                </div>
            </section>
            <!--Третий-->
            <section class="contacts">
                <form>
                <label for="name">Имя:</label>
                <input type="text" id="name" name="name" placeholder="Имя" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email" required>
                <label for="age">Возраст:</label>
                <input type="number" id="age" name="age" placeholder="Ваш возраст" required>
                <input type="submit" value="Отправить">
            </form>
            </section>
        </main>
        <footer>
            <p>&copy; Сумайя, 2026</p>
        </footer>
    </body>
</html>
